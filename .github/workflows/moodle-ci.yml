# jobs:
  PHPUnit:
    runs-on: ${{ matrix.os }}
    services:
      exttests:
        image: moodlehq/moodle-exttests
        ports:
          - 8080:80
      redis:
        image: redis
        ports:
          - 6379:6379
      postgres:
        image: ${{ matrix.db == 'pgsql' && 'postgres:16' || '' }}
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
    strategy:
      fail-fast: false
      matrix:
        moodle-branch: ['MOODLE_501_STABLE']
        include:
          # MySQL builds always run with the lowest PHP supported version.
          - os: ubuntu-24.04
            php: 8.4
            extensions:
            db: mysqli
          # Disable testing with PostgreSQL for now since we are not using it.
          # # PostgreSQL builds always run with the highest PHP supported version.
          # - os: ubuntu-24.04
          #   php: 8.4
          #   db: pgsql

    steps:

      #
      # 4. Start MySQL only for the MySQL matrix entry.
      #
      - name: Run MySQL Server
        if: ${{ matrix.db == 'mysqli' }}
        run: |
          docker run --rm \
            -e MYSQL_DATABASE=test \
            -e MYSQL_USER=test \
            -e MYSQL_PASSWORD=test \
            -e MYSQL_ROOT_PASSWORD=test \
            -p 3306:3306 \
            -d \
            --tmpfs /var/lib/mysql:rw,noexec,nosuid,size=1024M \
            mysql:8.4 \
              --skip-log-bin \
              --collation-server=utf8mb4_bin

      #
      # 6. Configure Git variables.
      #
      - name: Configuring git vars
        uses: rlespinasse/github-slug-action@v4

      #
      # 5. Configure PHP.
      #
      - name: Setting up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ matrix.extensions }}
          ini-values: max_input_vars=5000
          coverage: none

      #
      # 1. Check out YOUR plugin repository.
      #
      # - name: Checking out plugins
      #   uses: actions/checkout@v4
      #   with:
      #     path: plugin
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false

      #
      # 2. Check out Moodle core separately.
      #
      - name: Checking out Moodle ${{ matrix.moodle-branch }}
        uses: actions/checkout@v4
        # uses: actions/checkout@v6
        with:
          repository: moodle/moodle
          ref: ${{ matrix.moodle-branch }}
          path: moodle

      - name: Applying MDL-87086 patch
        working-directory: moodle
        run: |
          git remote add ctam https://github.com/ctam/moodle.git
          git fetch ctam MDL-87086-${{ matrix.moodle-branch }}
          git merge --no-edit FETCH_HEAD

      # #
      # # 3. Put the plugin into the Moodle checkout.
      # #
      # # Change MOD_PLUGIN_NAME to your plugin's directory name.
      # #
      # - name: Installing plugin
      #   run: |
      #     mkdir -p moodle/mod/MOD_PLUGIN_NAME
      #     cp -a plugin/. moodle/mod/MOD_PLUGIN_NAME/
      - name: Installing plugins
        run: |
          rsync -av \
            --exclude='.*' \
            --exclude='*.sh' \
            --exclude='composer.json' \
            plugin/public/ moodle/public/
      #
      # 7. Configure Moodle.
      #
      - name: Setting up PHPUnit in Moodle
        working-directory: moodle
        env:
          dbtype: ${{ matrix.db }}
        run: |
          echo "pathtophp=$(which php)" >> $GITHUB_ENV # Inject installed pathtophp to env. The template config needs it.
          cp .github/workflows/config-template.php config.php
          mkdir -p ../moodledata
          sudo locale-gen en_AU.UTF-8

          php public/admin/tool/phpunit/cli/init.php \
            --no-composer-self-update

      #
      # 8. Run the plugin's PHPUnit tests.
      #
      - name: Running PHPUnit tests
        working-directory: moodle
        env:
          dbtype: ${{ matrix.db }}
          phpunit_options: ${{ secrets.phpunit_options }}
        run: vendor/bin/phpunit $phpunit_options ${{ inputs.phpunit_extra_options }}

      #
      # 9. Show status for debugging.
      #
      - name: Git status
        working-directory: plugin
        run: git status --short
